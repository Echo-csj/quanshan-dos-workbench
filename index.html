<!-- ===== 初始化 ===== -->
<script>
(function() {
  // 更新 Topbar 信息
  function updateTopbar() {
    var now = new Date();
    var dateEl = document.getElementById('topbar-date');
    var weekEl = document.getElementById('topbar-week');
    var countdownEl = document.getElementById('countdown-timer');

    if (dateEl) dateEl.textContent = App.util.formatDate(now, 'YYYY年MM月DD日') + ' ' + App.util.getWeekdayName(now);
    if (weekEl) weekEl.textContent = '第' + App.util.getWeekNumber(now) + '周 · ' + App.util.getMonthName(now.getMonth()) + '第' + App.util.getMonthWeek(now) + '周';

    if (countdownEl) {
      var daysToSun = App.util.daysUntilSunday(now);
      if (daysToSun === 0) {
        countdownEl.className = 'countdown urgent';
        countdownEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 今天写周报！';
      } else if (daysToSun <= 2) {
        countdownEl.className = 'countdown';
        countdownEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 距周报 ' + daysToSun + ' 天';
      } else {
        countdownEl.className = 'countdown';
        countdownEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 距周报 ' + daysToSun + ' 天';
      }
    }

  }

  // 订阅数据变化自动更新角标
  App.store.subscribe(updateTopbar);

  // 启动应用
  function init() {
    // 确保数据已加载
    App.store.getData();

    // 更新顶部信息
    updateTopbar();

    // 解析路由并渲染初始视图
    App.router.init();

    console.log('[Workbench] 状元港·泉山校区 DOS 工作台 v1.0 已启动');
    console.log('[Workbench] 当前路由:', window.location.hash || '#/today');

    // 临时禁用 SW：强制注销并清理缓存，恢复为普通网页访问（解决顽固缓存）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.unregister().then(function () {
            console.log('[Workbench] 已注销旧 Service Worker');
          });
        });
      });
      // 清理所有缓存
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  }

  // DOM Ready 后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
